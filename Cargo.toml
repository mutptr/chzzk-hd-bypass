[package]
name = "chzzk"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
http = "1.5.0"
lru = "0.18.5"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = [
    "gzip",
    "brotli",
    "zstd",
    "deflate",
] }
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }
